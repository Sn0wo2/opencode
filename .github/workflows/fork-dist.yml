name: fork-dist

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-dist
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Sn0wo2/opencode' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
      upstream: ${{ steps.sync.outputs.upstream }}
      version: ${{ steps.sync.outputs.version }}
      bun: ${{ steps.sync.outputs.bun }}
      build: ${{ steps.sync.outputs.build }}
    steps:
      - name: Check sync token
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo 'Set UPSTREAM_SYNC_TOKEN with repository Contents and Workflows write permissions.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      - name: Disable workflows outside the fork whitelist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state == "active" and .path != ".github/workflows/fork-dist.yml") | [.id, .path] | @tsv' \
            | while IFS=$'\t' read -r id path; do
                echo "disabling $path (id $id)"
                gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable"
              done
      - id: sync
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/anomalyco/opencode.git dev
          upstream=$(git rev-parse FETCH_HEAD)
          if ! git merge-base --is-ancestor "$upstream" HEAD; then
            tries=0
            until git rebase -X theirs "$upstream"; do
              tries=$((tries + 1))
              if [ "$tries" -ge 5 ]; then
                git rebase --abort 2>/dev/null || true
                echo "upstream rebase did not complete" >&2
                exit 1
              fi
              while IFS= read -r -d '' file; do
                if git cat-file -e ":3:$file" 2>/dev/null; then
                  git checkout --theirs -- "$file"
                  git add -- "$file"
                else
                  git rm -f --ignore-unmatch -- "$file"
                fi
              done < <(git diff --name-only --diff-filter=U -z)
              GIT_EDITOR=true git rebase --continue || true
            done
            git push --force-with-lease origin HEAD:refs/heads/dev
          fi
          base=$(node -p 'require("./package.json").version.split("-")[0]')
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          bun=$(node -p 'require("./package.json").packageManager.replace(/^bun@/, "")')
          sha=$(git rev-parse HEAD)
          version="$base-beta.$(git rev-parse --short=12 HEAD)"
          build=true
          if npm view "@me0wo/opencode@$version" version >/dev/null 2>&1; then
            build=false
          fi
          {
            echo "sha=$sha"
            echo "upstream=$upstream"
            echo "version=$version"
            echo "bun=$bun"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
  validate:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun run --cwd packages/core typecheck:tsc
      - run: bun run --cwd packages/server typecheck:tsc
      - run: bun run --cwd packages/tui typecheck:tsc
      - run: bun run --cwd packages/gui-plugins typecheck:tsc
      - run: bun test test/session-generate.test.ts test/session-compaction.test.ts test/plugin/goal-watchdog.test.ts
        working-directory: packages/core

  build:
    needs: [sync, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest, explicit: true, bun-smoke: true, install-flags: "" }
          - { target: linux-arm64, os: ubuntu-latest, explicit: true, bun-smoke: false, install-flags: "" }
          - { target: windows-x64, os: ubuntu-latest, explicit: true, bun-smoke: false, install-flags: "" }
          - { target: windows-arm64, os: ubuntu-latest, explicit: true, bun-smoke: false, install-flags: "" }
          - { target: darwin-arm64, os: ubuntu-latest, explicit: true, bun-smoke: false, install-flags: "" }
          - { target: darwin-x64, os: macos-15-intel, explicit: false, bun-smoke: true, skip-install: true, install-flags: "--os=darwin --cpu=x64" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      OPENCODE_TARGET: ${{ matrix.explicit && matrix.target || '' }}
      OPENCODE_VERSION: ${{ needs.sync.outputs.version }}
      OPENCODE_CHANNEL: latest
      OPENCODE_RELEASE_NOTES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install dependencies
        env:
          INSTALL_FLAGS: ${{ matrix.install-flags }}
        run: |
          python3 -m pip install setuptools || pip install setuptools || true
          for attempt in 1 2 3; do
            bun install --frozen-lockfile $INSTALL_FLAGS && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
      - name: Add macOS x64 native packages
        if: matrix.skip-install
        env:
          INSTALL_FLAGS: ${{ matrix.install-flags }}
        run: |
          node -e '
            const fs = require("fs")
            const lock = JSON.parse(fs.readFileSync("bun.lock", "utf8").replace(/,\s*([}\]])/g, "$1"))
            const names = ["@parcel/watcher-darwin-x64", "@ff-labs/fff-bin-darwin-x64", "@yuuang/ffi-rs-darwin-x64"]
            const specs = names.map((n) => `${n}@${lock.packages[n][0].split("@").at(-1)}`)
            const flags = (process.env.INSTALL_FLAGS || "").split(" ").filter(Boolean)
            const result = require("child_process").spawnSync("bun", ["add", "--dev", "--exact", ...flags, ...specs], { cwd: "packages/cli", stdio: "inherit" })
            process.exit(result.status ?? 1)
          '
      - name: Build JS bundle
        working-directory: packages/cli
        run: bun run build:node -- --bundle-only ${{ matrix.skip-install && '--skip-install' || '' }}
      - name: Patch for Bun
        working-directory: packages/cli/dist-node
        run: |
          cat > opencode-sea-shim.mjs <<'EOF'
          import { createRequire } from "node:module"
          const req = createRequire(import.meta.url)
          const nodeModule = req("node:module")
          export const isSea = () => false
          export const getAssetKeys = () => []
          export const getRawAsset = () => { throw new Error("SEA assets are unavailable in the bun-runnable bundle") }
          export const registerHooks = nodeModule.registerHooks ?? (() => () => {})
          EOF
          sed -i.bak 's#from"node:sea"#from"./opencode-sea-shim.mjs"#g' opencode.mjs
          sed -i.bak 's#{createRequire,registerHooks}from"node:module"#{createRequire}from"node:module";import{registerHooks}from"./opencode-sea-shim.mjs"#g' opencode.mjs
          sed -i.bak 's#{registerHooks,createRequire}from"node:module"#{createRequire}from"node:module";import{registerHooks}from"./opencode-sea-shim.mjs"#g' opencode.mjs
          sed -i.bak 's#\.registerHooks({#.registerHooks?.({#g' opencode.mjs
          rm -f opencode.mjs.bak
      - name: Smoke with Bun
        if: matrix.bun-smoke
        working-directory: packages/cli/dist-node
        run: bun opencode.mjs --version && bun opencode.mjs --help >/dev/null
      - name: Package
        working-directory: packages/cli
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.sync.outputs.version }}
        run: |
          case "$TARGET" in
            linux-x64) os=linux; cpu=x64; libc='["glibc"]' ;;
            linux-arm64) os=linux; cpu=arm64; libc='["glibc"]' ;;
            darwin-arm64) os=darwin; cpu=arm64; libc=null ;;
            darwin-x64) os=darwin; cpu=x64; libc=null ;;
            windows-x64) os=win32; cpu=x64; libc=null ;;
            windows-arm64) os=win32; cpu=arm64; libc=null ;;
            *) exit 1 ;;
          esac
          jq -n --arg name "@me0wo/opencode-$TARGET" --arg version "$VERSION" \
            --arg os "$os" --arg cpu "$cpu" --argjson libc "$libc" \
            --arg effect "$(jq -r '.workspaces.catalog.effect' "$GITHUB_WORKSPACE/package.json")" \
            '{name: $name, version: $version, license: "MIT", repository: {type: "git", url: "git+https://github.com/Sn0wo2/opencode.git"}, os: [$os], cpu: [$cpu], libc: $libc, dependencies: {effect: $effect, "@opencode/plugin": "2"}, publishConfig: {access: "public"}} | with_entries(select(.value != null))' > dist-node/package.json
          (cd dist-node && zip -qry "$GITHUB_WORKSPACE/opencode-patcher-$TARGET-v$VERSION.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-${{ matrix.target }}
          path: opencode-patcher-*.zip
          if-no-files-found: error

  verify:
    needs: [sync, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: windows-x64, os: windows-latest }
          - { target: windows-arm64, os: windows-11-arm }
          - { target: darwin-arm64, os: macos-latest }
          - { target: darwin-x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist-${{ matrix.target }}
          path: dist
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ needs.sync.outputs.bun }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
      - name: Extract
        shell: bash
        run: |
          mkdir oc
          case "$RUNNER_OS" in
            Windows) /c/Windows/System32/tar.exe -xf dist/*.zip -C oc ;;
            *) unzip -q dist/*.zip -d oc ;;
          esac
      - name: Verify bundle
        working-directory: oc
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bun opencode.mjs --version
          bun opencode.mjs --help >/dev/null
          mkdir -p "nest/node_modules/@me0wo/opencode-$TARGET"
          mv assets opencode.mjs opencode-sea-shim.mjs package.json "nest/node_modules/@me0wo/opencode-$TARGET/"
          cd "nest/node_modules/@me0wo/opencode-$TARGET"
          bun install
          bun opencode.mjs --version
          node opencode.mjs --version

  npm-publish:
    needs: [sync, build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.sync.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: dist-*
          merge-multiple: true
          path: out
      - name: Stage packages
        run: |
          set -euo pipefail
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64 windows-x64 windows-arm64; do
            mkdir -p "stage/@me0wo/opencode-$target"
            unzip -q "out/opencode-patcher-$target-v$VERSION.zip" -d "stage/@me0wo/opencode-$target"
          done
          mkdir -p stage/@me0wo/opencode/bin
          cp .github/fork/cli.mjs stage/@me0wo/opencode/bin/cli.mjs
          jq -n --arg version "$VERSION" '{name: "@me0wo/opencode", version: $version, description: "OpenCode fork JS bundle", license: "MIT", bin: {"opencode-patcher": "bin/cli.mjs"}, files: ["bin/"], optionalDependencies: {"@me0wo/opencode-linux-x64": $version, "@me0wo/opencode-linux-arm64": $version, "@me0wo/opencode-darwin-arm64": $version, "@me0wo/opencode-darwin-x64": $version, "@me0wo/opencode-windows-x64": $version, "@me0wo/opencode-windows-arm64": $version}, engines: {node: ">=26.4.0"}, repository: {type: "git", url: "git+https://github.com/Sn0wo2/opencode.git"}, publishConfig: {access: "public"}}' > stage/@me0wo/opencode/package.json
      - name: Publish to npm
        run: |
          set -euo pipefail
          publish() {
            name=$(jq -r .name package.json)
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then return; fi
            for attempt in 1 2 3; do
              npm publish --provenance --tag latest && return
              [ "$attempt" = 3 ] && return 1
              sleep 15
            done
          }
          for dir in stage/@me0wo/opencode-*; do (cd "$dir" && publish); done
          (cd stage/@me0wo/opencode && publish)
